name: Check redesigned exam UI in browser
on:
  push:
    branches: [main]
    paths: ['qa/exam-ux-v2-smoke.mjs']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exam-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright browser
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium
      - name: Test desktop and mobile exam navigation
        run: node qa/exam-ux-v2-smoke.mjs
