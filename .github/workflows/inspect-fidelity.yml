name: Inspect source fidelity discrepancies
on:
  push:
    paths: ['qa/inspect-fidelity.py']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - run: python3 qa/inspect-fidelity.py
      - name: Save question-level inspection
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qa/fidelity-review-details.json
          git diff --cached --quiet || (git commit -m "data: snapshot literal-PDF fidelity review" && git push)
