name: Apply reviewed Schreiben audit statuses
on:
  push:
    paths:
      - '.github/workflows/one-time-schreiben-audit.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Apply only source-supported writing metadata corrections
        run: |
          python3 - <<'PY'
          import json,re,pathlib,collections
          path=pathlib.Path('exam-practice.html')
          raw=path.read_text(encoding='utf-8')
          m=re.search(r'(<script id="bank-data" type="application/json">)(.*?)(</script>)',raw,re.S)
          assert m, 'Original embedded question bank missing'
          bank=json.loads(m.group(2))
          report={'before':{},'after':{},'changed':[],'left_flagged':[],'by_detail':{}}
          qs=[(e,q) for e in bank['exercises'] if e.get('section')=='Schreiben' for q in e.get('questions',[])]
          def status():return dict(collections.Counter(q.get('completeness','unset') for _,q in qs))
          report['before']=status()
          for e,q in qs:
            old=q.get('completeness')
            kind=q.get('kind')
            detail=e.get('detail','')
            prompt=(q.get('prompt') or '').strip()
            answer=q.get('answer')
            opts=q.get('options') or []
            if old not in ('manual_review','source_incomplete'):
              continue
            is_forum='forum' in detail.lower()
            is_audio=any(x in detail.lower() for x in ('telefon','hör','audio'))
            is_placeholder=(not prompt or 'exact question' in prompt.lower() or 'unavailable' in prompt.lower() or 'missing' in prompt.lower())
            # Forumsbeitrag is a free-writing task: it does not require A/B/C or an official answer key.
            if is_forum and kind=='free' and not is_placeholder and len(prompt)>60:
              q['completeness']='complete_source'
              q['completeness_reason']='The source supplies the complete forum-writing topic. This is an open writing task, not an A/B/C question; the learner response requires manual assessment.'
              q['audit_review_date']='2026-11-14'
              q['source_alt_note']=(q.get('source_alt_note','')+' Reviewed: Forumsbeitrag requires free writing, not multiple-choice answers.').strip()
            # Clear only objective questions whose selected answer is present among their source options.
            elif not is_audio and kind=='mc' and answer and any(o.get('value')==answer for o in opts) and len(opts)>=2 and not is_placeholder:
              q['completeness']='complete_source'
              q['completeness_reason']='Full question and selectable options are present. The displayed answer was source-inferred or user-reviewed; it is not an official examination key.'
              q['audit_review_date']='2026-11-14'
            else:
              report['left_flagged'].append({'id':q.get('id'),'page':q.get('page'),'detail':detail,'status':old})
              continue
            report['changed'].append({'id':q.get('id'),'page':q.get('page'),'detail':detail,'from':old,'to':q['completeness']})
          report['after']=status()
          report['by_detail']={d:dict(collections.Counter(q.get('completeness') for e,q in qs if e.get('detail')==d)) for d in sorted(set(e.get('detail') for e,q in qs))}
          encoded=json.dumps(bank,ensure_ascii=False,separators=(',',':')).replace('</','<\\/')
          updated=raw[:m.start(2)]+encoded+raw[m.end(2):]
          assert len(bank['exercises'])>90 and len(qs)>80
          assert len(updated)>3000000
          path.write_text(updated,encoding='utf-8')
          pathlib.Path('qa/schreiben-audit-applied.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')
          print('WRITING_AUDIT', json.dumps({'total':len(qs),'changed':len(report['changed']),'before':report['before'],'after':report['after']}))
          PY
      - name: Count current question-bank gaps across all sections
        run: |
          python3 - <<'PY'
          import pathlib,re,json,collections
          s=pathlib.Path('exam-practice.html').read_text(encoding='utf-8')
          m=re.search(r'<script id="bank-data" type="application/json">(.*?)</script>',s,re.S)
          assert m, 'Question bank missing'
          bank=json.loads(m.group(1))
          sections={}
          details={}
          totals=collections.Counter()
          examples={}
          for exercise in bank['exercises']:
              section=exercise.get('section','Unknown')
              detail=exercise.get('detail','Unknown')
              for q in exercise.get('questions',[]):
                  status=q.get('completeness','unclassified')
                  totals[status]+=1
                  sections.setdefault(section,collections.Counter())[status]+=1
                  details.setdefault(section+' | '+detail,collections.Counter())[status]+=1
                  if status not in ('complete_source',):
                      examples.setdefault(section+' | '+detail,[]).append({'id':q.get('id'),'page':q.get('page'),'number':q.get('number'),'status':status,'reason':q.get('completeness_reason','')[:220]})
          report={'total_questions':sum(totals.values()),'exercise_groups':len(bank['exercises']),'statuses':dict(totals),'by_section':{k:dict(v) for k,v in sections.items()},'by_detail':{k:dict(v) for k,v in details.items()},'flagged_examples':{k:v[:5] for k,v in examples.items()}}
          pathlib.Path('qa/question-bank-status.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')
          print('QUESTION_BANK_STATS',json.dumps({'total':report['total_questions'],'status':report['statuses'],'sections':report['by_section']}))
          PY
      - name: Publish reviewed changes to live app
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add exam-practice.html qa/schreiben-audit-applied.json qa/question-bank-status.json
          git diff --cached --quiet || (git commit -m "Apply source-supported Schreiben review decisions and preserve unresolved flags" && git push)
