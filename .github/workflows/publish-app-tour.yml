name: Publish narrated app tour

on:
  push:
    branches: [main]
    paths:
      - 'qa/record-app-tour.mjs'
      - 'qa/build-tour-audio.py'
      - '.github/workflows/publish-app-tour.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-app-tour
  cancel-in-progress: false

jobs:
  build-tour:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser and speech dependencies
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium
          sudo apt-get update -qq
          sudo apt-get install -y -qq espeak-ng ffmpeg
      - name: Record real app interface on mobile-sized Chromium
        run: node qa/record-app-tour.mjs
      - name: Generate spoken narration
        run: python3 qa/build-tour-audio.py
      - name: Combine video and voice explanation
        run: |
          WEBM=$(find media/_tour_build -maxdepth 1 -name '*.webm' -type f | head -n 1)
          test -s "$WEBM"
          test -s media/_tour_build/narration.wav
          ffmpeg -hide_banner -loglevel error -y -i "$WEBM" -i media/_tour_build/narration.wav -c:v libx264 -preset faster -crf 26 -pix_fmt yuv420p -c:a aac -b:a 112k -t 32 -movflags +faststart media/Deutsch_B2_Beruf_App_Tour.mp4
          test -s media/Deutsch_B2_Beruf_App_Tour.mp4
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 media/Deutsch_B2_Beruf_App_Tour.mp4
      - name: Publish MP4 to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add media/Deutsch_B2_Beruf_App_Tour.mp4
          git commit -m "Publish spoken real-app tour video" || exit 0
          git push origin HEAD:main
