name: Quality checks

on:
  push:
    branches: [main]
    paths:
      - '*.html'
      - '*.js'
      - '*.css'
      - '*.webmanifest'
      - '*.svg'
      - 'qa/**'
      - '.github/workflows/quality.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    name: Core learning, data and accessibility smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Node QA suite
        run: node --test qa/quality.test.mjs
