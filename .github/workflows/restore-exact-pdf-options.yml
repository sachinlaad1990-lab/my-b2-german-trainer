name: Restore verified PDF question options
on:
  push:
    paths:
      - 'qa/verified-options-restoration.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: exact-pdf-options-restoration
  cancel-in-progress: false
jobs:
  restore:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Restore exact PDF options
        run: python3 qa/verified-options-restoration.py
      - name: Verify bank and options
        run: |
          python3 - <<'PY'
          import json,re,pathlib
          s=pathlib.Path('exam-practice.html').read_text(encoding='utf-8')
          b=json.loads(re.search(r'<script id="bank-data" type="application/json">(.*?)</script>',s,re.S).group(1))
          q=[q for e in b['exercises'] if e['section'] in ('Lesen','Schreiben','Hören','Sprechen') for q in e['questions']]
          assert len(q)==602
          assert len(b['source_page_records'])==149
          report=json.loads(pathlib.Path('qa/verified-options-restoration-report.json').read_text())
          assert report['restored_count']==len(report['restored'])
          assert all(item['options'] and len(item['options'])==3 for item in report['restored'])
          print('Validated exact source changes:',report['restored_count'])
          PY
      - name: Commit only verified corrections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add exam-practice.html qa/verified-options-restoration-report.json
          git diff --cached --quiet || (git commit -m "Restore PDF-exact A/B/C options; preserve unresolved source flags" && git push)
