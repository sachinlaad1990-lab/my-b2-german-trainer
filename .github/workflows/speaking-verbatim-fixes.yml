name: Publish original PDF speaking prompt wording
on:
  push:
    paths: ['qa/speaking-verbatim-fixes.py']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - run: python3 qa/speaking-verbatim-fixes.py
      - name: Verify original 602 prompts are retained
        run: |
          python3 - <<'PY'
          import json,re,pathlib
          s=pathlib.Path('exam-practice.html').read_text()
          b=json.loads(re.search(r'<script id="bank-data" type="application/json">(.*?)</script>',s,re.S).group(1))
          assert len([q for e in b['exercises'] if e['section'] in ('Lesen','Schreiben','Hören','Sprechen') for q in e['questions']])==602
          assert len(b['source_page_records'])==149
          PY
      - name: Commit source-exact wording
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add exam-practice.html qa/speaking-verbatim-fixes.json
          git diff --cached --quiet || (git commit -m "Preserve eight speaking-topic bullets verbatim from PDF" && git push)
